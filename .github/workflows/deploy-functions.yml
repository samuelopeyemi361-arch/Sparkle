name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify 5SIM secret is present
        run: |
          set -euo pipefail
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" | grep -Fq "FIVESIM_API_KEY"; then
            echo "::error::FIVESIM_API_KEY is missing from Supabase Edge Function Secrets."
            exit 1
          fi
          echo "5SIM secret is configured (value was not displayed)."

      - name: Deploy active Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remove retired provider registrations and secret
        run: |
          set -euo pipefail
          for fn in \
            sparkle-fleexa-buy \
            sparkle-fleexa-cancel \
            sparkle-fleexa-catalog \
            sparkle-fleexa-check \
            sparkle-fleexa-test \
            sparkle-svb-buy \
            sparkle-svb-cancel \
            sparkle-svb-catalog \
            sparkle-svb-check \
            svb-canada-cost-check-once
          do
            echo "Removing retired provider function: $fn"
            supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_ID" --yes
          done

          # Remove the retired key only after verifying the replacement key exists.
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" | grep -Fq "SOFTVIRALBOOST_API_KEY"; then
            supabase secrets unset SOFTVIRALBOOST_API_KEY --project-ref "$SUPABASE_PROJECT_ID"
            echo "Retired provider secret removed."
          else
            echo "Retired provider secret already absent."
          fi
