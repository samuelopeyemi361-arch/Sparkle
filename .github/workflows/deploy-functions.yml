name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy active Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remove retired Fleexa function registrations
        run: |
          set -euo pipefail
          for fn in \
            sparkle-fleexa-buy \
            sparkle-fleexa-cancel \
            sparkle-fleexa-catalog \
            sparkle-fleexa-check \
            sparkle-fleexa-test
          do
            echo "Removing retired function: $fn"
            supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_ID" --yes
          done
