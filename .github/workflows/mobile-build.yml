name: TheSparkle Android Build

on:
  push:
    branches:
      - mobile/capacitor-foundation
    paths:
      - "mobile/**"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose Android validation or signed release (release requires Android signing secrets)"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: thesparkle-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
    name: Android debug APK and AAB validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy current web app into mobile bundle
        run: npm run sync:web

      - name: Generate Android native project
        run: npx cap add android

      - name: Apply TheSparkle Android launcher branding
        run: npm run brand:android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build debug AAB validation artifact
        run: cd android && ./gradlew bundleDebug

      - name: Upload Android test builds
        uses: actions/upload-artifact@v4
        with:
          name: thesparkle-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14

  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
    name: Signed Android release APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy current web app into mobile bundle
        run: npm run sync:web

      - name: Generate Android native project
        run: npx cap add android

      - name: Apply TheSparkle Android launcher branding
        run: npm run brand:android

      - name: Sync Android
        run: npx cap sync android

      - name: Build unsigned release APK and AAB
        run: cd android && ./gradlew assembleRelease bundleRelease

      - name: Sign and verify Android release files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/thesparkle-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "Android SDK build-tools directory was not found." >&2
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Android zipalign/apksigner tools were not found." >&2
            exit 1
          fi

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          UNSIGNED_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          SIGNED_DIR="build/signed-release"
          mkdir -p "$SIGNED_DIR"

          if [ ! -f "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_AAB" ]; then
            echo "Expected unsigned Android release outputs were not found." >&2
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$SIGNED_DIR/app-release-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_DIR/TheSparkle-release.apk" \
            "$SIGNED_DIR/app-release-aligned.apk"
          "$APKSIGNER" verify --verbose "$SIGNED_DIR/TheSparkle-release.apk"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$SIGNED_DIR/TheSparkle-release.aab" \
            "$UNSIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$SIGNED_DIR/TheSparkle-release.aab" >/dev/null

          rm -f "$KEYSTORE_PATH"
          rm -f "$SIGNED_DIR/app-release-aligned.apk"

      - name: Upload signed Android release files
        uses: actions/upload-artifact@v4
        with:
          name: thesparkle-android-signed-release
          path: |
            mobile/build/signed-release/TheSparkle-release.apk
            mobile/build/signed-release/TheSparkle-release.aab
          if-no-files-found: error
          retention-days: 14
