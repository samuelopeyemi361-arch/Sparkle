<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Product | TheSparkle Marketplace</title>
<meta name="description" content="Shop products on TheSparkle Marketplace."><meta property="og:site_name" content="TheSparkle Marketplace">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17243c;font:15px/1.5 Inter,system-ui,sans-serif}header{background:linear-gradient(115deg,#071b4d,#1357c8);color:white;padding:18px max(18px,calc((100% - 980px)/2));font-weight:900}header small{display:block;color:#c7d8ff;font-size:10px;letter-spacing:1.5px}main{max-width:980px;margin:28px auto;padding:0 16px}.crumb{font-size:12px;color:#73819a;margin-bottom:14px}.card{background:white;border:1px solid #e4eaf3;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);box-shadow:0 12px 35px #102b5510}.visual{background:#f8faff;min-height:340px;display:grid;place-items:center;padding:20px}.visual img{max-width:100%;max-height:460px;object-fit:contain}.details{padding:26px}.details h1{font-size:25px;line-height:1.2;margin:0 0 12px}.price{font-size:27px;color:#0a347f;font-weight:900}.muted{color:#74819a;font-size:12px}.description{white-space:pre-wrap;margin:20px 0}.share{border:0;border-radius:10px;padding:12px 16px;background:#1762e8;color:white;font-weight:800;cursor:pointer}.state{padding:55px 20px;text-align:center;color:#64738b}.variants{display:flex;gap:8px;flex-wrap:wrap}.variants span{background:#eef3fc;border-radius:8px;padding:7px 10px;font-size:12px}.shareurl{overflow-wrap:anywhere;font-size:11px;color:#60708a;margin-top:12px}@media(max-width:680px){.card{grid-template-columns:1fr}.visual{min-height:260px}.details{padding:20px}}
</style></head><body><header>TheSparkle <small>MARKETPLACE</small></header><main><div class="crumb">Marketplace / Product</div><div id="app" class="state">Loading product…</div></main>
<script>
(async function(){const root=document.getElementById("app"),slug=new URLSearchParams(location.search).get("slug");if(!slug){root.textContent="Product link is incomplete.";return}try{const r=await fetch("/api/marketplace/product?slug="+encodeURIComponent(slug));const j=await r.json();if(!r.ok)throw new Error(j.error||"Product unavailable");const p=j.product;document.title=p.title+" | TheSparkle Marketplace";const desc=(p.description||"Shop this product on TheSparkle Marketplace.").slice(0,155);const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=desc;const og=document.createElement("meta");og.setAttribute("property","og:title");og.content=p.title;document.head.appendChild(og);const image=document.createElement("meta");image.setAttribute("property","og:image");image.content=p.image_url||"";document.head.appendChild(image);root.className="card";root.innerHTML='<div class="visual">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'">':'<div class="muted">Product photo unavailable</div>')+'</div><section class="details"><div class="muted">'+esc(p.category||"Marketplace product")+'</div><h1>'+esc(p.title)+'</h1><div class="price">'+new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:2}).format(Number(p.product_price_ngn))+'</div><div class="muted">Product price only. Shipping and other charges are calculated separately.</div><div class="description">'+esc(p.description||"Product details will be updated after supplier verification.")+'</div><div class="variants">'+(Array.isArray(p.variants)?p.variants.map(v=>'<span>'+esc(typeof v==="string"?v:(v.label||v.name||JSON.stringify(v)))+'</span>').join(""):"")+'</div><button class="share" id="share">Share product</button><div class="shareurl">'+esc(location.href)+'</div></section>';document.getElementById("share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:"See this product on TheSparkle Marketplace",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Product link copied.")}}catch(e){if(e.name!=="AbortError")alert("Copy this product link from the address bar.")}}}catch(e){root.className="state";root.textContent=e.message}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}})();
</script></body></html>
